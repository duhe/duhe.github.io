  	/*border: 1px solid white;   /* add this */
  	box-sizing: border-box;    /* ensures border doesn’t affect sizing */
  }
  .tooltip {
    position: fixed;
    padding: 6px 8px;
    font: 12px/1.2 Arial, sans-serif;
    background: rgba(0,0,0,0.85);
    color: #fff;
    border-radius: 6px;
    white-space: nowrap;
    pointer-events: none;     /* don't block clicks */
    /* transform: translate(-50%, -8px); /* center above */

    display: none;            /* hidden by default */

  .tooltip.show { display: block; }

// ----- UTILITIES -----
function variantSrc(base, variant) {
  // variant is 'a' or 'b'; filenames are aXXX.png / bXXX.png
  return imgDir + variant + base;
}

function preload(srcs) {
  srcs.forEach(s => { const i = new Image(); i.src = s; });
}

// ----- RENDER -----
const scaleX = W / refWidth;
const scaleY = H / refHeight;

// a single tooltip element reused for all tiles
const tipEl = document.createElement("div");
tipEl.className = "tooltip";
container.appendChild(tipEl);

function positionTooltipForOLD(img) {
  // center tooltip above the tile
  const rect = img.getBoundingClientRect();
  const cRect = container.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2 - cRect.left;
  const topY = rect.top - cRect.top; // top edge within container
  tipEl.style.left = `${centerX}px`;
  tipEl.style.top  = `${topY}px`;
}
function positionTooltipFor(el, text) {
  tipEl.textContent = text;
  tipEl.style.display = "block"; // show to measure size

  const rect = el.getBoundingClientRect();
  const tw = tipEl.offsetWidth;
  const th = tipEl.offsetHeight;
  const margin = 8;

  // Prefer above; if not enough space, place below
  let top = rect.top - th - margin;
  if (top < margin) top = rect.bottom + margin;

  // Center horizontally, then clamp to viewport
  let left = rect.left + rect.width / 2 - tw / 2;
  left = Math.max(margin, Math.min(left, window.innerWidth - tw - margin));

  tipEl.style.top = `${Math.round(top)}px`;
  tipEl.style.left = `${Math.round(left)}px`;
  tipEl.classList.add("show");

  activeTarget = el;
}


table.forEach((row, idx) => {
  // scale coords
  const l_px = row.l * scaleX;
  const r_px = row.r * scaleX;
  const b_px = row.b * scaleY;
  const t_px = row.t * scaleY;

  const x = l_px;
  const y = t_px;
  const w = r_px - l_px;
  const h = b_px - t_px;

  // create <img>
  const img = document.createElement("img");
  img.className = "tile";
  img.alt = row.base;
  img.dataset.base = row.base;
  img.dataset.variant = "b"; // default
  img.style.left   = x + "px";
  img.style.top    = y + "px";
  img.style.width  = w + "px";
  img.style.height = h + "px";
  img.style.objectFit = useCover ? "cover" : "fill";

  // preload both variants, set default src=bXXX.png
  const srcB = variantSrc(row.base, "b");
  const srcA = variantSrc(row.base, "a");
  const tipText = row.tip || "";
  preload([srcA, srcB]);
  img.src = srcB;

  // toggle on click
  img.addEventListener("click", () => {
    const cur = img.dataset.variant;
    const next = cur === "b" ? "a" : "b";
    img.dataset.variant = next;
    img.src = variantSrc(img.dataset.base, next);
    // toggle tooltip visibility
    if (tipEl.classList.contains("show") && tipEl.textContent === tipText) {
    	tipEl.style.display = "none";
      tipEl.classList.remove("show");
    } else {
      tipEl.textContent = tipText;
      positionTooltipFor(img,tipEl.textContent);
      //positionTooltipForOLD(img);
      tipEl.classList.add("show");
    }
  });
 	// click outside to hide
  document.addEventListener("click", (e) => {
    if (!container.contains(e.target)){
    	tipEl.classList.remove("show"); 
    	tipEl.style.display = "none";
    }
  });
  container.appendChild(img);
});
