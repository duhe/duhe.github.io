<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pointrets: list</title>
  <style>
    :root {
      --bg: #000;
      --panel: #0b0b0b;
      --border: #1a1a1a;
      --text: #e8e8e8;
      --muted: #bfbfbf;
      --accent: #2f81f7;
    }
    html,body { background: #000; height: 100%; margin: 0; padding: 0;margin: 0; background: var(--bg); color: var(--text); }
    /*body {
      margin: 0; background: var(--bg); color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }*/
    body {
      margin: 0; background: var(--bg); color: var(--text);
      font: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Noto Sans", Arial, "Apple Color Emoji", "Segoe UI Emoji";   
    }
    .wrap { max-width: 750px; margin: 24px auto; padding: 0 16px; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--muted); margin: 8px 0 18px; }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03) inset, 0 10px 30px rgba(0,0,0,0.6);
      margin: 18px 0;
    }
    .media { display: block; height: auto; max-width: 100%; }

    .meta {
      display: flex; align-items: center; justify-content: flex-start;
      padding: 10px 12px; gap: 8px; border-top: 1px solid var(--border);
    }
    .hint { color: var(--muted); font-size: 0.9rem; }

    .toggle {
      appearance: none; border: 1px solid var(--border); background: #101010; color: var(--text);
      padding: 6px 10px; border-radius: 0; cursor: pointer; font-weight: 600;
    }
    .toggle:focus { outline: 2px solid var(--accent); outline-offset: 2px; }

    /* Hidden content area */
    .hidden {
      display: none; padding: 14px 12px; border-top: 1px dashed var(--border);
    }
    /* Reveal on hover OR when the card has .show */
    .card.show .hidden { display: block; }

    .title { font-size: 1.05rem; font-weight: 700; margin: 0 0 10px; }
    .line { margin: 10px 0; }
    .line img { width: 100%; height: auto; display: block; border-radius: 0; border: 1px solid var(--border); }
		.line a,
		.line a:visited { color: #fff; }
		.line a:hover   { text-decoration: underline; }

    .footer-note { color: var(--muted); font-size: 0.85rem; margin-top: 14px; }
    /* Ra { color: #9ec1ff; text-decoration: none; }*/
    /* Ra:hover { text-decoration: underline; }*/
  </style>
</head>

  <script>

    // Example data row provided by you. Add more objects to this array as needed.
    const DATA = [
{base: 'vulture.png', w:140, h:100, tip: '1993: The Struggling Girl (Kevin Carter)', info1: 'На самом деле выяснилось, что это мальчик (предположительно нашли в 2011 году, выжил). Выигравшая Пулитцера фотография голодающего суданского ребёнка и стервятника.', info2: 'Полное название: «Стервятник и маленькая девочка». На фотографа вылился поток хейта - он покончил жизнь самоубийством в 1994'},
{base: 'jobs.png', w:100, h:140, tip: '2006: Steve Jobs (Albert Watson)', info1: '«У нас был час», — вспоминает Уотсон. «Он должен был прийти в девять, и появился без одной минуты девять». PR‑менеджер объяснила, что Джобс терпеть не может фотографов, и Уотсон быстро придумал, как завоевать его доверие. «Думаю, управлюсь за полчаса», — сказал он Джобсу, который отреагировал на это, как на «рождественский подарок».', info2: 'Джобсу сказали «слегка податься вперёд к камере» и изобразить выражение лица, как будто он спорит за столом с людьми, которые с ним не согласны, хотя он уверен, что прав. Джобс пояснил Уотсону, что для него это «легко», потому что он часто так делает.'},
{base: 'bluered.png', w:100, h:140, tip: '1880: Self-portrait (Vincent Van Gogh)', info1: 'Большинство автопортретов — более 25 — были выполнены в Париже (1886–1888). В тот период у него не хватало денег и он с трудом находил моделей, поэтому художник выбрал простое решение — писал себя.', info2: 'Известно более 35 автопортретов Винсента, но существует лишь одна его фотография‑портрет.'},
{base: 'gagarin.png', w:100, h:100, tip: '1961: Юрий Гагарин (Совфото)', info1: 'Один виток', info2: 'Популяризовано «108 минут», рассекреченная история полёта пишет 106.'},
{base: 'peach.png', w:100, h:140, tip: '1887: Девочка с персиками (Валентин Серов)', info1: '«Всё, чего я добивался, — это свежести, той особенной свежести, которую всегда чувствуешь в натуре и не видишь в картинах. Писал я больше месяца и измучил её, бедную, до смерти, уж очень хотелось сохранить свежесть живописи при полной законченности, — вот как у старых мастеров».', info2: 'В конце декабря 1907 года, в возрасте 32 лет, заболела пневмонией и вскоре умерла.'},
{base: 'maya.png', w:100, h:140, tip: '1920: Маяковский (unknown)', info1: 'Сходил в фотостудию', info2: 'Почти всю юность Маяковский проходил без зубов. Сказалось очень бедное после смерти отца существование и год в тюрьме, из которой Маяковский вышел практически беззубым – были разрушены 16 зубов. Чуть позднее, в 22-23 Маяковский обзавелся новыми зубными протезами, их оплатила Лилия Брик. '},
{base: 'square.png', w:140, h:100, tip: '1989: Tank Man (Jeff Widener)', info1: 'В апреле 1998 года журнал Time включил «Неизвестного мятежника» в список 100 самых влиятельных людей XX века.', info2: 'В 2003 году журнал Life издал книгу «100 фотографий, изменивших мир», куда также вошли снимки людей, останавливающих колонну танков.'},
{base: 'banksy.png', w:140, h:100, tip: '2002: Balloon Girl (Banksy)', info1: '«Девочка с шаром» (Girl With Balloon), также известная как Balloon Girl, впервые была создана в Лондоне в 2002 году: изначально трафарет нанесён на стены под Ватерлоо‑бридж на Саутбэнке. Другая версия появилась примерно в то же время в Шордиче, на стенах типографии на востоке Лондона.', info2: 'Картина Бэнкси «Девочка с шаром» самоуничтожилась на аукционе, что произвело фурор в СМИ. Сразу после продажи на Sotheby’s в 2018 году полотно стало проходить через шредер, скрытый в раме. Покупатель не отказался от сделки, а работа получила новое название — «Любовь в корзине» (Love Is In The Bin) — единственное оригинальное произведение, созданное в прямом эфире аукциона.'},
{base: 'scream.png', w:100, h:140, tip: '1893: The Scream (Edvard Munch)', info1: 'Мунк вспоминал, что гулял на закате, когда лучи заходящего солнца вдруг окрасили облака «в кроваво‑красный». Он почувствовал «бесконечный крик, проходящий через природу».', info2: 'Норвежское название произведения — «Skrik»'},
{base: 'pink.png', w:100, h:140, tip: '1961: Breakfast at Tiffanys (Blake Edwards)', info1: 'Одри Хэпбёрн', info2: 'Плакат Роберта МакГиннисома, известного американского художника и иллюстратора, автора многочисленных афиш к фильмам и обложкам книг'},
{base: 'napoleon.png', w:100, h:140, tip: '1840: Napoleon at Fontainebleau (Paul Delaroche)', info1: 'Работа создана в том же году, когда состоялась доставка останков Наполеона с острова Св. Елены.', info2: 'Полное название: «Наполеон I в Фонтенбло 31 марта 1814 года».'},
{base: 'dali.png', w:100, h:100, tip: '1954: Spanish painter Salvador Dali (Philippe Halsman)', info1: 'Поговаривают, что Усы Дали были больше чем данью моде — это символ его уникального видения и художественного гения.', info2: 'Усы Дали были застрахованы на 1 миллион долларов, он очень их берег. Он говорил, что никогда не сбрил бы их, даже за миллион.'},
{base: 'audrey_hands.png', w:100, h:140, tip: '1950: Audrey Hepburn (unknown)', info1: 'Одри Хепбёрн', info2: 'Имя при рождении Одри Кэтлин Растон (1929–1993)'},
{base: 'sailor.png', w:100, h:140, tip: '1945: V-J Day in Times Square (Alfred Eisenstaedt)', info1: 'Случайный непостановочный снимок', info2: 'День победы над Японией — 14 августа 1945 года. Фотография была опубликована неделей позже в журнале Life в 12‑страничном разделе «Празднования победы», где собрали кадры торжеств по всей стране.'},
{base: 'whistler_Mother.png', w:140, h:100, tip: '1871: Whistlers Mother (James Whistler)', info1: 'Это одно из самых известных произведений американского искусства за пределами США; его называли американской иконой и «викторианской Мона Лизой».', info2: ''},
{base: 'pulp.png', w:140, h:100, tip: '1994: Pulp Fiction (Quentin Tarantino)', info1: 'Ума Турман', info2: 'По мере того как «Криминальное чтиво» захватывало воображение Голливуда, его постер захватывал комнаты общаг США по всей стране.'},
{base: 'hitchhock.png', w:100, h:140, tip: '1960: Alfred Hitchcock (unknown)', info1: 'Альфред Хичкок', info2: 'В начале 1960-х Хичкоку был запрещен вход в Диснейленд. Сам Уолт Дисней отказал ему в просьбе использовать Диснейленд в качестве локации для съемок. Обосновал тем, что Хичкок «снял тот отвратительный фильм — Психо». '},
{base: 'renoir_JeanneSamary.png', w:100, h:140, tip: '1877: The Day Dream (Pierre-Auguste Renoir)', info1: 'Работа была показана на Третьей выставке импрессионистов в 1877 году и была встречена в основном негативно. Позже вошла в собрание Ивана Морозова, конфискованное советским государством после Октябрьской революции.', info2: 'В 1970 году изображение появилось на марке СССР.'},
{base: 'che.png', w:100, h:100, tip: '1960: Che Guevara (Alberto Korda)', info1: 'Снимок сделан 5 марта 1960 года в Гаване на траурной церемонии по жертвам взрыва на судне «Ла Кубр».', info2: 'Подчёркивая вездесущность и широкую привлекательность изображения, Мэрилендский институт колледжа искусств назвал его символом XX века и «самой известной фотографией в мире».'},
{base: 'monroe_set.png', w:100, h:140, tip: '1954: The Seven Year Itch (Billy Wilder)', info1: 'Из-за собравшейся толпы фанатов, Мэрилин пришлось перезаписать сцену уже на территории студии 20th Century Fox.', info2: ''},
{base: 'sparrow.png', w:100, h:100, tip: '2003: Pirates of the Caribbean (Gore Verbinski)', info1: 'Джонни Депп', info2: 'Походка капитана Джека Воробья у Джонни Деппа в первую очередь вдохновлена Китом Ричардсом (The Rolling Stones) — особенно его узнаваемой манерой двигаться, — а также включает элементы исследований о пиратах XVIII века и остроумную игру на эффекте синдрома mal de débarquement (известного как «болезнь схода на берег»), что и создаёт уникальную “пьяную” поступь персонажа.'},
{base: 'johny.png', w:100, h:140, tip: '1980: The Shining (Stanley Kubrick)', info1: 'Фраза «Heres is Johnny!» пришла из ночного шоу «The Tonight Show Starring Johnny Carson».', info2: ''},
{base: 'kiss.png', w:100, h:140, tip: '1908: The Kiss (Gustav Klimt)', info1: 'нем. Der Kuss', info2: 'Искусствоведы предполагают, что Климт изображает историю Орфея и Эвридики.'},
{base: 'adam.png', w:140, h:100, tip: '1512: The Creation of Adam (Michelangelo)', info1: 'Потолок Сикстинской капеллы, написан ок. 1508–1512 годов.', info2: 'Некоторые считают, что Микеланджело намеренно изобразил Бога внутри очертания человеческого мозга, указывая на связь между божественным вдохновением и человеческим разумом.'},
{base: 'demon.png', w:140, h:100, tip: '1890: Демон Сидящий (Михаил Врубель)', info1: 'В этой работе и других Врубель исследовал тему Демона из поэмы М. Лермонтова (1839) — байронического демона, влюбившегося в грузинскую княжну, погибшую от его поцелуя.', info2: 'Лицо своего демона Врубель наделил «женскими» чертами. Возможно, он желал выразить нечто среднее между мужской и женской стихиями природы.'},
{base: 'hamming.png', w:100, h:140, tip: '1957: Ernest Hemingway (Yousuf Karsh)', info1: 'Карш считал Хемингуэя застенчивым человеком, «избитым жизнью», но, казалось, неуязвимым, что контрастировало с ожиданиями увидеть героя своих романов.', info2: ''},
{base: 'joconda.png', w:100, h:140, tip: '1506: Gioconda (Leonardo da Vinci)', info1: 'Название картины, известной по‑английски как Mona Lisa, основано на предположении, что она изображает Лизу дель Джокондо, хотя сходство неочевидно.', info2: 'В 1911 году картина ещё не была популярна у широкой публики. 21 августа 1911 года её украли из Лувра; на следующий день о пропаже первым сообщил художник Луи Беро. Это стало началом популярности'},
{base: 'lilu.png', w:100, h:100, tip: '1997: The Fifth Element (Luc Besson)', info1: 'Мила Йовович', info2: 'Lilu Dallas, multipass'},
{base: 'pearl.png', w:100, h:140, tip: '1665: Girl with a Pearl Earring (Johannes Vermeer)', info1: 'Последняя реставрация (1994) выявила скрытые нюансы цветовой гаммы и усилила интимность взгляда девушки на зрителя.', info2: 'В ходе работ обнаружили, что тёмный фон, ныне местами пятнистый, изначально был глубокого эмалевого зелёного цвета.'},
{base: 'audrey_tall.png', w:100, h:140, tip: '1961: Breakfast at Tiffanys (Blake Edwards)', info1: 'Одри Хепбёрн', info2: 'Что она держит во рту называется «Cigarillo» («Сигарильо»).'},
{base: 'rockafeller.png', w:140, h:100, tip: '1932: Lunch atop a Skyscraper (unclear)', info1: 'Снимок часто ошибочно приписывают Льюису Хайну, но истинный автор неизвестен. Появлялись свидетельства в пользу Чарльза Эббетса, но выяснилось, что на съёмке присутствовали и другие фотографы. Личности рабочих на фото также во многом не установлены.', info2: 'Многие заявляли о своей идентификации на снимке, но достоверно подтверждены лишь немногие.'},
{base: 'venus.png', w:100, h:140, tip: '1486: The Birth of Venus (Sandro Botticelli)', info1: 'Бесконечно анализировалось искусствоведами; основные темы — подражание античным живописцам и контекст свадебных торжеств.', info2: 'Сюжет — не строго «Рождение Венеры» (название закрепилось в XIX веке), а следующая сцена её истории: прибытие на берег, гонимая ветром.'},
{base: 'ghandy.png', w:140, h:100, tip: '1946: Gandhi and His Spinning Wheel (Margaret Bourke-White)', info1: 'Этот снимок появился в журнале LIFE лишь через несколько месяцев, и то маленькой картинкой над статьёй (июнь 1946) о том, как Ганди увлекался «природными лечениями» для больных.', info2: 'Прялка Ганди, или чаркха, — портативное устройство для прядения хлопка; стала мощным символом независимости Индии и экономической самодостаточности в борьбе против британского владычества.'},
{base: 'amelie.png', w:140, h:100, tip: '2001: Amelie (Jean-Pierre Jeunet)', info1: 'Одри Тоту', info2: 'Милая девушка, наслаждающаяся маленькими радостями жизни. Ложечка для раскалывания корочки крем‑брюле.'},
{base: 'enstein.png', w:100, h:140, tip: '1951: Einsteins tongue (Arthur Sasse)', info1: 'Альберт Энштейн', info2: 'Снимок сделан в 1951 году, на его 72‑й день рождения, после долгого дня, когда фотографы просили его улыбаться. Раздражённый, Эйнштейн показал язык, покидая вечеринку в Принстоне.'},
{base: 'frida.png', w:100, h:140, tip: '1940: Thorn Necklace and Hummingbird (Frida Kahlo)', info1: 'У неё была домашняя обезьянка‑паук.', info2: 'Большой <a href="https://www.fridakahlo.org/assets/img/paintings/self-portrait-with-necklace-of-thorns.jpg">оригинал</a>'},
{base: '_malevich.png', w:100, h:100, tip: '1915: Черный квадрат (Казимир Малевич)', info1: '■', info2: 'Относится к циклу супрематических работ Малевича, в которых художник исследовал базовые возможности цвета и композиции; задумана как часть триптиха вместе с «Чёрным кругом» и «Чёрным крестом».'},
{base: 'pushkin.png', w:100, h:140, tip: '1827: Портрет Пушкина (Орест Кипренского)', info1: 'Александр «наше всё» Пушкин', info2: 'В сентябре 1826 года Пушкин был вызван императором Николаем из ссылки в Михайловском. Поэту разрешили жить в обеих столицах, и в мае 1827 года он приехал из Москвы в Петербург, где и был нарисован'},
{base: 'wecandoit.png', w:100, h:140, tip: '1943: We Can Do It! (Howard Miller)', info1: 'Джеральдин Хофф Дойл ошибочно считала, что она — прототип плаката. Она думала, что запечатлена на военной фотографии работницы завода и что именно она вдохновила плакат Миллера.', info2: ''},
{base: 'curbet_DesparateMan.png', w:140, h:100, tip: '1845: Le Désespéré (Gustave Courbet)', info1: 'Густав был так привязан к полотну «Отчаявшийся», что забрал его с собой в эмиграцию в Швейцарию в 1873 году.', info2: ''},
{base: 'kramskoy_Neizvestnaya.png', w:140, h:100, tip: '1883: Неизвестная (Иван Крамской)', info1: 'Портрет часто ошибочно называют «Незнакомкой» по одноимённому стихотворению Александра Блока (1906). Сам Блок боготворил картину Крамского и до 1917 года любил ходить в Третьяковскую галерею.', info2: ''},
{base: 'archimboldo.png', w:100, h:140, tip: '1591: Vertumnus (Giuseppe Arcimboldo)', info1: 'Хотя современники Арчимбольдо называли «Vertumnus» шуткой, в нём есть и намеренные политические смыслы, в частности выбор плодов, овощей и цветов.', info2: 'Вертумн — римский бог времён года, перемен и роста растений, а также садов и плодовых деревьев.'},

{base: 'fournier_OmayraSanchez.png', w:140, h:100, tip: '1985: Omayra Sánchez (Frank Fournier)', info1: 'Оползень от извержения вулкана Невадо‑дель‑Руис в Армеро, департамент Толима. Санчес оказалась под завалами собственного дома и три дня находилась в воде; спасатели не могли оказать помощь, поскольку у них не было возможности провести ампутацию зажатых ног.', info2: 'Снимок Санчес, сделанный фотожурналистом Франком Фурнье незадолго до её смерти, был опубликован по всему миру и получил премию World Press Photo года за 1986‑й'},

    // Utility to create elements safely with text
		// 1) upgrade helper to support HTML
		function el(tag, cls, text, isHTML = false) {
		  const node = document.createElement(tag);
		  if (cls) node.className = cls;
		  if (text !== undefined) {
		    isHTML ? node.innerHTML = text : node.textContent = text;
		  }
		  return node;
		}

		function appendInfo(parent, html) {
		  const p = el('p', 'line', html, true);     // <-- HTML, not text
		  p.querySelectorAll('a').forEach(a => {
		    const href = a.getAttribute('href') || '';
		    // optional safety: allow only http/https
		    if (!/^https?:/i.test(href)) a.removeAttribute('href');
		    a.target = '_blank';
		    a.rel = 'noopener noreferrer';
		  });
		  parent.appendChild(p);
		}
    // Apply optional width/height from item.w/item.h (number -> px or string with units)
    function applySize(el, w, h) {
      const set = (prop, v) => {
        if (v === undefined || v === null || v === '') return false;
        if (typeof v === 'number') el.style[prop] = v + 'px';
        else el.style[prop] = String(v);
        return true;
      };
      const hasW = set('width', w);
      const hasH = set('height', h);
      if (!hasW && !hasH) {
        el.style.width = '100%'; // fallback to previous responsive behavior
      }
      el.style.maxWidth = '100%';
      el.style.height = el.style.height || 'auto';
    }

    function makeCard(item) {
      const card = el('article', 'card');

      // 1) Visible image: b{base}
      const img = new Image();
      img.src = `${VISIBLE_PREFIX}${item.base}`;
      img.alt = (item.tip || item.top || item.base || '').toString();
      img.className = 'media';
      applySize(img, item.w, item.h);
      card.appendChild(img);

      // Control bar: hint + button (for click-to-toggle)
      const meta = el('div', 'meta');
      
      const btn = el('button', 'toggle', 'show');
      btn.setAttribute('aria-expanded', 'false');
      btn.addEventListener('click', () => {
        const open = card.classList.toggle('show');
        btn.textContent = open ? 'hide' : 'show';
        btn.setAttribute('aria-expanded', String(open));
      });
      meta.appendChild(btn);
      card.appendChild(meta);

      // 2) Hidden lines: title (tip/top), hidden image a{base}, info1, info2
      const hidden = el('div', 'hidden');

      // Title line (use tip; fallback to top if present)
      if (item.tip || item.top) {
        hidden.appendChild(el('h2', 'title', String(item.tip || item.top)));
      }

      // Hidden image: a{base}
      if (item.base) {
        const lineImg = el('div', 'line');
        const imgA = new Image();
        imgA.src = `${HIDDEN_PREFIX}${item.base}`;
        imgA.alt = `Alternate / companion image for ${item.tip || item.base}`;
        applySize(imgA, item.w, item.h);
        // If the a{base} image is missing, fail silently (hide the line)
        imgA.addEventListener('error', () => { lineImg.remove(); });
        lineImg.appendChild(imgA);
        hidden.appendChild(lineImg);
      }

			if (item.info1) appendInfo(hidden, item.info1);
			if (item.info2) appendInfo(hidden, item.info2);
      
      card.appendChild(hidden);
      return card;
    }

    const app = document.getElementById('app');
    DATA.forEach(row => app.appendChild(makeCard(row)));
  </script>
